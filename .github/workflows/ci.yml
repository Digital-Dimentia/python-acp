name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and run validation
        run: |
          make venv
          make lint
          make test
          make build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-acp-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
