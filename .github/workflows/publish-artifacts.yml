name: publish-artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build release artifacts
        run: |
          make venv
          make build
          make container-image
          mkdir -p artifacts
          tar -czf artifacts/python-acp-artifacts.tar.gz -C dist .
      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.tar
            artifacts/*.tar.gz
