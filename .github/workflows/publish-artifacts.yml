name: publish-artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Deliberately the floor from `requires-python`, not the newest version in
          # ci.yml's matrix: releases build on the oldest supported interpreter so the
          # published wheel stays installable across the whole declared range.
          python-version: "3.11"
      - name: Build release artifacts
        run: |
          make venv
          make build
          # REQUIRE_CONTAINER=1: a release must not silently ship without its
          # container image. Locally the target skips when no usable engine is
          # present; here that skip is a build failure.
          make container-image REQUIRE_CONTAINER=1
          mkdir -p artifacts
          tar -czf artifacts/python-acp-artifacts.tar.gz -C dist .
      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.tar
            artifacts/*.tar.gz
