      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="790" height="790" fill="#ffffff"/>

  <!-- subgraphs -->
  <g fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5">
