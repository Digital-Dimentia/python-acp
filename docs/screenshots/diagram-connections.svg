<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="235" viewBox="0 0 1300 235" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1300" height="235" fill="#ffffff"/>

  <!-- nodes -->
  <g stroke="#d0d7de" stroke-width="1.5" fill="#f6f8fa">
    <rect x="30"   y="70" width="180" height="60" rx="8"/>
    <rect x="390"  y="70" width="180" height="60" rx="8"/>
    <rect x="750"  y="70" width="180" height="60" rx="8"/>
    <rect x="1110" y="70" width="180" height="60" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#1f2328" font-size="14">
    <text x="120" y="105">You, in LocalACP</text>
    <text x="480" y="96">LocalACP</text><text x="480" y="115" font-size="12.5" fill="#57606a">ACP client</text>
    <text x="840" y="96">python-acp</text><text x="840" y="115" font-size="12.5" fill="#57606a">ACP agent</text>
    <text x="1200" y="96">Demo MCP server</text><text x="1200" y="115" font-size="12.5" fill="#57606a">subprocess</text>
  </g>

  <!-- forward edges -->
  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M 210 100 L 384 100"/>
    <path d="M 570 100 L 744 100"/>
    <path d="M 930 100 L 1104 100"/>
  </g>
  <g text-anchor="middle" fill="#57606a" font-size="12">
    <text x="657" y="88">ACP over stdio</text>
    <text x="1017" y="88">JSON-RPC over stdio</text>
  </g>

  <!-- return edges -->
  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M 1150 130 L 1150 190 L 880 190 L 880 136"/>
    <path d="M 790 130 L 790 190 L 520 190 L 520 136"/>
  </g>
  <g text-anchor="middle" fill="#57606a" font-size="12">
    <text x="1015" y="209">tools, prompts, resources</text>
    <text x="655" y="209">session/update, request_permission</text>
  </g>
</svg>
