[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-acp"
version = "0.1.0"
description = "ACP app that exposes MCP tools over WebSockets"
readme = "README.md"
# Floor is ours (3.11); the ceiling is imposed by agent-client-protocol, whose
# own requires-python is ">=3.10,<3.15". Raising it here without the SDK raising
# it first produces an uninstallable release, so the two move together.
requires-python = ">=3.11,<3.15"
# Kept in lockstep with the python-version matrix in .github/workflows/ci.yml:
# every version listed here is one CI actually runs lint, tests, and build against.
# The list must also stay inside the requires-python window above.
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# Version policy for runtime dependencies: exact pins. These are protocol
# surface, not conveniences -- agent-client-protocol's generated models *are*
# the ACP wire contract this bridge implements, and it is pre-1.0, so a minor
# bump is allowed to be breaking. Upgrades are therefore deliberate, reviewed,
# single-purpose commits, never a resolver's choice at install time.
#
# agent-client-protocol is Zed's Agent *Client* Protocol SDK
# (github.com/agentclientprotocol/python-sdk). It is NOT PyPI `acp-sdk`, which
# is IBM's Agent *Communication* Protocol -- a different protocol, same
# abbreviation. Do not substitute one for the other.
#
# It pulls pydantic>=2.7 (and pydantic-core, typing-extensions,
# typing-inspection, annotated-types) transitively; that is this project's
# first non-pure-Python dependency. Its WebSocket/HTTP transport lives behind
# the SDK's `http` extra (httpx[http2]>=0.27 + websockets>=12.0), which we do
# not take: it is ASGI-shaped and would pull starlette/uvicorn, and we already
# pin websockets directly and drive our own transport (decision B4).
#
# websockets is on 17.0.1, not 12.0: `pyacp-tzd.3` rebuilt the WebSocket binding
# on `websockets.asyncio.server`, and the legacy `websockets.serve` API that 12.0
# offered is deprecated. 17.0.1 declares `requires-python >=3.11`, which is
# exactly this project's floor, so the pin does not narrow the support window.
dependencies = [
  "agent-client-protocol==0.12.1",
  "websockets==17.0.1",
]

[project.optional-dependencies]
dev = [
  "build==1.2.2",
  # Already arrives transitively via pytest; declared explicitly because
  # tests/test_sdk_dependency.py imports it to parse the SDK's requires-python.
  "packaging>=24.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.0.0",
  "ruff==0.6.9",
]

[project.scripts]
python-acp = "python_acp.cli:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
