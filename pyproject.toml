[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-acp"
version = "0.2.0"
description = "ACP app that exposes MCP tools over WebSockets"
readme = "README.md"
# Floor is ours (3.11); the ceiling is imposed by agent-client-protocol, whose
# own requires-python is ">=3.10,<3.15". Raising it here without the SDK raising
# it first produces an uninstallable release, so the two move together.
requires-python = ">=3.11,<3.15"
# Kept in lockstep with the python-version matrix in .github/workflows/ci.yml:
# every version listed here is one CI actually runs lint, tests, and build against.
# The list must also stay inside the requires-python window above.
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# Version policy for runtime dependencies: exact pins. These are protocol
# surface, not conveniences -- agent-client-protocol's generated models *are*
# the ACP wire contract this bridge implements, and it is pre-1.0, so a minor
# bump is allowed to be breaking. Upgrades are therefore deliberate, reviewed,
# single-purpose commits, never a resolver's choice at install time.
#
# agent-client-protocol is Zed's Agent *Client* Protocol SDK
# (github.com/agentclientprotocol/python-sdk). It is NOT PyPI `acp-sdk`, which
# is IBM's Agent *Communication* Protocol -- a different protocol, same
# abbreviation. Do not substitute one for the other.
#
# It pulls pydantic>=2.7 (and pydantic-core, typing-extensions,
# typing-inspection, annotated-types) transitively; that is this project's
# first non-pure-Python dependency. Its WebSocket/HTTP transport lives behind
# the SDK's `http` extra (httpx[http2]>=0.27 + websockets>=12.0), which we do
# not take: it is ASGI-shaped and would pull starlette/uvicorn, and we already
# pin websockets directly and drive our own transport (decision B4).
#
# ruamel.yaml is the one runtime pin that is not protocol surface, and the
# justification has to be a different one. It is this: THERE IS NO YAML PARSER
# IN THE STANDARD LIBRARY, and `edit_yaml.py`'s whole product is a verifier that
# checks a splice against an *independent* parser. A hand-rolled loader sitting
# beside the hand-rolled scanner would not be independent in the sense that
# matters -- same author, same misreading of the spec, shared bugs -- so the
# verifier would agree with itself and prove nothing. Buying a second opinion is
# the point; the library IS the oracle.
#
# Cost, checked on PyPI before pinning: ruamel_yaml-0.19.1-py3-none-any.whl is
# 118,102 bytes, declares requires-python >=3.9 (under this project's 3.11 floor,
# with no upper bound, so it does not touch the SDK's <3.15 ceiling), and has
# ZERO hard dependencies. It is pure Python and adds no wheel of its own beyond
# that 118 KB -- two orders of magnitude below the pydantic cost table in
# CLAUDE.md.
#
# NEVER TAKE THE `libyaml` OR `oldlibyaml` EXTRAS. Every ruamel.yaml.clib
# requirement is gated behind them, and clib is a C extension: taking either
# would reintroduce per-architecture wheels for a speed-up this project has no
# use for, since it parses one file per edit and not a stream.
#
# websockets is on 17.0.1, not 12.0: `pyacp-tzd.3` rebuilt the WebSocket binding
# on `websockets.asyncio.server`, and the legacy `websockets.serve` API that 12.0
# offered is deprecated. 17.0.1 declares `requires-python >=3.11`, which is
# exactly this project's floor, so the pin does not narrow the support window.
dependencies = [
  "agent-client-protocol==0.12.1",
  "ruamel.yaml==0.19.1",
  "websockets==17.0.1",
]

[project.optional-dependencies]
dev = [
  "build==1.2.2",
  # Already arrives transitively via pytest; declared explicitly because
  # tests/test_sdk_dependency.py imports it to parse the SDK's requires-python.
  "packaging>=24.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.0.0",
  "ruff==0.6.9",
]

[project.scripts]
python-acp = "python_acp.cli:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
# A subprocess this suite started and never reaped is otherwise invisible: nothing
# raises, and only CPython 3.11 even mentions it, as an unraisable from
# `BaseSubprocessTransport.__del__` finalized after its loop closed. `pyacp-6k5` traced
# three separate causes behind one such warning, so it is an error rather than a note.
#
# **The test it is reported against is not the test that leaked.** It fires wherever the
# garbage collector happened to run. To find the real one, drop a conftest that wraps
# `asyncio.create_subprocess_exec`, keeps a *strong* reference to every process (a weak
# one hides exactly the case that warns), and at `pytest_sessionfinish` reports any whose
# `_transport._closed` is False along with the test that created it. See CLAUDE.md.
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
